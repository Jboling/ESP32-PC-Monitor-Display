; PlatformIO project for Waveshare ESP32-S3-Touch-LCD-3.49
; https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-3.49

[platformio]
default_envs = esp32-s3-touch-lcd-349

[env:esp32-s3-touch-lcd-349]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.extra_flags =
    -DBOARD_HAS_PSRAM

extra_scripts =
    pre:scripts/generate_wifi_config.py

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I ../vendor/waveshare/Arduino_Libraries/lvgl9
    -I src/board

lib_extra_dirs =
    ../vendor/waveshare/Arduino_Libraries/lvgl9/lvgl

lib_deps =
    bblanchon/ArduinoJson@^7.3.0

build_src_filter =
    +<*>
    +<board/>
    +<board/src/>
    -<board/10_LVGL_V9_Test.ino>
